<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Multi-Video Sync Player</title>
<style>
    body {
        margin: 0;
        background: black;
        display: flex;
        flex-direction: column;
        align-items: center;
        color: white;
        overflow-x: hidden;
    }

    #controls {
        display: flex;
        gap: 10px;
        padding: 10px;
        background: #111;
        justify-content: center;
        width: 100%;
        max-width: 900px;
        box-sizing: border-box;
        position: sticky;
        top: 0;
        z-index: 10;
    }

    button {
        background: purple;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 6px;
    }

    button:hover {
        background: #b300b3;
    }

    /* RESPONSIVE VIDEO GRID */
    #container {
        width: 100%;
        max-width: 900px;
        display: grid;
        gap: 5px;
        background: black;
        box-sizing: border-box;
        padding: 5px;

        /* FORCE GRID TO START AT TOP */
        align-content: start;
        justify-content: center;
    }

    /* Desktop: 4 columns */
    @media (min-width: 900px) {
        #container {
            grid-template-columns: repeat(4, 1fr);
        }
    }

    /* Medium screens: 3 columns */
    @media (min-width: 600px) and (max-width: 899px) {
        #container {
            grid-template-columns: repeat(3, 1fr);
        }
    }

    /* Mobile portrait: 2 columns */
    @media (max-width: 599px) {
        #container {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    /* Mobile landscape: 3 columns */
    @media (max-height: 450px) {
        #container {
            grid-template-columns: repeat(3, 1fr);
        }
    }

    video {
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        background: black;
        border-radius: 4px;
    }
</style>
</head>
<body>

<div id="controls">
    <button id="addBtn">Add Videos</button>
    <button id="playBtn">Play All</button>
    <button id="pauseBtn">Pause All</button>
    <button id="loopBtn">Loop All</button>
</div>

<div id="container"></div>

<script>
    let videoSources = [];

    const container = document.getElementById("container");

    function rebuildGrid() {
        container.innerHTML = "";

        videoSources.forEach(src => {
            const vid = document.createElement("video");
            vid.src = src;

            vid.autoplay = true;
            vid.loop = true;
            vid.muted = true;
            vid.playsInline = true;

            container.appendChild(vid);
        });
    }

    // Add Videos Button
    document.getElementById("addBtn").onclick = () => {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = "video/*";
        input.multiple = true;

        input.onchange = () => {
            for (const file of input.files) {
                const url = URL.createObjectURL(file);
                videoSources.push(url);
            }
            rebuildGrid();
        };

        input.click();
    };

    // Play All Button (sound fix)
    document.getElementById("playBtn").onclick = () => {
        document.querySelectorAll("video").forEach(v => {
            v.muted = false;
            v.play();
        });
    };

    // Pause All Button
    document.getElementById("pauseBtn").onclick = () => {
        document.querySelectorAll("video").forEach(v => v.pause());
    };

    // Loop All Button
    document.getElementById("loopBtn").onclick = () => {
        document.querySelectorAll("video").forEach(v => v.loop = true);
    };
</script>

</body>
</html>
