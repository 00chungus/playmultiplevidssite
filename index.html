<!DOCTYPE html>
<html lang="en" class="h-full bg-black text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Minimalist Multi-Video Split Player</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * {
      touch-action: manipulation;
    }
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    ::-webkit-scrollbar { display: none; }
    
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
    }
    input[type="range"]:focus { outline: none; }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.3);
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 14px;
      width: 14px;
      border-radius: 50%;
      background: #3b82f6;
      margin-top: -5px;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(0,0,0,0.5);
    }

    .glass-overlay {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .video-fit-cover {
      object-fit: cover !important;
    }
    .video-fit-contain {
      object-fit: contain !important;
    }

    /* UI visibility toggle transition */
    .ui-hidden {
      opacity: 0 !important;
      pointer-events: none !important;
      transition: opacity 0.3s ease;
    }
    .ui-visible {
      opacity: 1;
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body class="h-full w-full flex flex-col font-sans bg-black text-slate-100 overflow-hidden select-none">

  <!-- Floating Top Navigation Bar -->
  <header id="mainHeader" class="absolute top-0 left-0 right-0 z-30 p-2 pointer-events-none flex items-center justify-between ui-visible">
    <div class="flex items-center space-x-2 pointer-events-auto">
      <!-- Add Files Button -->
      <label class="flex items-center space-x-1 px-3 py-1.5 rounded-full bg-blue-600 active:bg-blue-700 text-white text-xs font-semibold shadow-lg cursor-pointer transition">
        <i data-lucide="plus" class="w-4 h-4"></i>
        <span>Add / Replace Video(s)</span>
        <input type="file" accept="video/*" multiple onchange="handleFilesUpload(event)" class="hidden">
      </label>

      <!-- Layout Selector -->
      <select id="layoutSelect" onchange="changeLayout(this.value)" class="bg-black/60 border border-white/20 text-xs text-white rounded-full px-2.5 py-1.5 focus:outline-none backdrop-blur">
        <option value="auto">Auto Grid</option>
        <option value="vertical">Split Stack</option>
        <option value="horizontal">Split Side-by-Side</option>
      </select>
    </div>

    <div class="flex items-center space-x-2 pointer-events-auto">
      <!-- Master Sync Play/Pause -->
      <button onclick="toggleMasterPlay()" title="Master Play/Pause" class="p-2 rounded-full bg-black/60 border border-white/20 active:bg-white/20 text-white backdrop-blur shadow-lg">
        <i id="masterPlayIcon" data-lucide="play" class="w-4 h-4 fill-current"></i>
      </button>

      <!-- Hide Controls Toggle Button -->
      <button onclick="toggleUiVisibility()" title="Hide Controls" class="flex items-center space-x-1 px-2.5 py-1.5 rounded-full bg-slate-800/80 active:bg-slate-700 text-slate-200 border border-white/20 font-semibold text-xs shadow-lg backdrop-blur">
        <i data-lucide="eye-off" class="w-3.5 h-3.5"></i>
        <span>Hide Controls</span>
      </button>

      <!-- Copy GitHub Code Button -->
      <button id="copyGithubBtn" onclick="copyCodeToClipboard()" class="flex items-center space-x-1 px-2.5 py-1.5 rounded-full bg-amber-500/80 active:bg-amber-600 text-slate-950 font-bold text-xs shadow-lg backdrop-blur">
        <i data-lucide="code" class="w-3.5 h-3.5"></i>
        <span id="copyGithubText">Copy Code</span>
      </button>
    </div>
  </header>

  <!-- Tiny Unhide Floating Button (Visible when controls are hidden) -->
  <button id="showUiBtn" onclick="toggleUiVisibility()" class="fixed top-3 right-3 z-40 p-2.5 rounded-full bg-black/70 border border-white/30 text-white shadow-2xl backdrop-blur hidden active:scale-95 transition">
    <i data-lucide="eye" class="w-4 h-4"></i>
  </button>

  <!-- Edge-to-Edge Grid Container -->
  <main class="flex-1 w-full h-full relative overflow-hidden bg-black">
    <div id="videoGrid" class="w-full h-full grid grid-cols-1 divide-y divide-slate-800/50 sm:divide-y-0 sm:divide-x">
      <!-- Dynamic Video Slots Inserted Here -->
    </div>
  </main>

  <div id="toastContainer" class="fixed bottom-16 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script>
    const SAMPLE_VIDEOS = [
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4"
    ];

    let slots = [];
    let nextSlotId = 1;
    let isUiHidden = false;

    window.addEventListener('DOMContentLoaded', () => {
      addVideoSlot(SAMPLE_VIDEOS[0]);
      addVideoSlot(SAMPLE_VIDEOS[1]);
      updateLayoutClass();
      lucide.createIcons();
    });

    function handleFilesUpload(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;

      // Smart Replace: If user uploads files, update existing slots first before adding new ones
      for (let i = 0; i < files.length; i++) {
        const fileUrl = URL.createObjectURL(files[i]);
        if (i < slots.length) {
          // Replace existing slot video
          updateExistingSlotSource(slots[i].id, fileUrl, files[i].name);
        } else {
          // Add extra slot if user uploaded more files than open slots
          addVideoSlot(fileUrl, files[i].name);
        }
      }

      // If user uploaded fewer files than current slots, keep layout clean
      showToast(`Loaded ${files.length} video(s)`);
      event.target.value = '';
    }

    function updateExistingSlotSource(slotId, newUrl, title = "") {
      const slot = slots.find(s => s.id === slotId);
      if (!slot) return;

      slot.url = newUrl;
      if (title) slot.title = title;

      const vid = document.getElementById(`vid-${slotId}`);
      if (vid) {
        vid.src = newUrl;
        vid.load();
      }
    }

    function addVideoSlot(sourceUrl = "", title = "") {
      const slotId = nextSlotId++;
      const url = sourceUrl || SAMPLE_VIDEOS[slots.length % SAMPLE_VIDEOS.length];

      const slot = {
        id: slotId,
        title: title || `Vid ${slots.length + 1}`,
        url: url,
        speed: 1.0,
        fitMode: 'cover', // 'cover' or 'contain'
        rotation: 0
      };

      slots.push(slot);
      renderVideoCard(slot);
      updateLayoutClass();
    }

    function removeVideoSlot(slotId) {
      if (slots.length <= 1) {
        showToast("Keep at least 1 video open");
        return;
      }
      const el = document.getElementById(`slot-${slotId}`);
      if (el) el.remove();
      slots = slots.filter(s => s.id !== slotId);
      updateLayoutClass();
    }

    function toggleUiVisibility() {
      isUiHidden = !isUiHidden;
      const header = document.getElementById('mainHeader');
      const showBtn = document.getElementById('showUiBtn');
      const slotControls = document.querySelectorAll('.slot-control-overlay');

      if (isUiHidden) {
        header.classList.remove('ui-visible');
        header.classList.add('ui-hidden');
        showBtn.classList.remove('hidden');
        slotControls.forEach(ctrl => {
          ctrl.classList.remove('ui-visible');
          ctrl.classList.add('ui-hidden');
        });
        showToast("Controls Hidden (Tap eye to show)");
      } else {
        header.classList.remove('ui-hidden');
        header.classList.add('ui-visible');
        showBtn.classList.add('hidden');
        slotControls.forEach(ctrl => {
          ctrl.classList.remove('ui-hidden');
          ctrl.classList.add('ui-visible');
        });
      }
    }

    function updateLayoutClass() {
      const grid = document.getElementById('videoGrid');
      const layout = document.getElementById('layoutSelect').value;
      const count = slots.length;

      grid.className = "w-full h-full grid";

      if (layout === 'vertical') {
        grid.classList.add(`grid-rows-${Math.min(count, 4)}`, 'grid-cols-1');
      } else if (layout === 'horizontal') {
        grid.classList.add('grid-rows-1', `grid-cols-${Math.min(count, 4)}`);
      } else {
        // Auto Grid
        if (count === 1) {
          grid.classList.add('grid-cols-1', 'grid-rows-1');
        } else if (count === 2) {
          grid.classList.add('grid-cols-1', 'sm:grid-cols-2', 'grid-rows-2', 'sm:grid-rows-1');
        } else if (count <= 4) {
          grid.classList.add('grid-cols-2', 'grid-rows-2');
        } else {
          grid.classList.add('grid-cols-2', 'sm:grid-cols-3');
        }
      }
    }

    function renderVideoCard(slot) {
      const grid = document.getElementById('videoGrid');
      const card = document.createElement('div');
      card.id = `slot-${slot.id}`;
      card.className = "relative w-full h-full bg-black flex items-center justify-center overflow-hidden group";

      card.innerHTML = `
        <!-- Video Canvas/Tag -->
        <video id="vid-${slot.id}" src="${slot.url}" loop crossorigin="anonymous"
          playsinline webkit-playsinline
          onloadedmetadata="onVideoLoaded(${slot.id})"
          ontimeupdate="onVideoTimeUpdate(${slot.id})"
          onclick="togglePlaySlot(${slot.id})"
          class="w-full h-full video-fit-cover transition-transform duration-300 cursor-pointer">
        </video>

        <!-- Top Right Mini Slot Actions -->
        <div class="slot-control-overlay absolute top-3 right-3 z-10 flex items-center space-x-1.5 opacity-80 hover:opacity-100 transition ${isUiHidden ? 'ui-hidden' : 'ui-visible'}">
          <!-- Fit Cover/Contain Toggle -->
          <button onclick="toggleFitMode(${slot.id})" title="Toggle Fill/Fit Screen" class="p-1.5 rounded-full glass-overlay text-white border border-white/20 active:scale-95">
            <i id="fitIcon-${slot.id}" data-lucide="maximize" class="w-3.5 h-3.5"></i>
          </button>
          
          <!-- Rotate 90deg -->
          <button onclick="rotateVideo(${slot.id})" title="Rotate 90°" class="p-1.5 rounded-full glass-overlay text-white border border-white/20 active:scale-95">
            <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
          </button>

          <!-- Remove Slot -->
          <button onclick="removeVideoSlot(${slot.id})" title="Remove" class="p-1.5 rounded-full glass-overlay text-rose-400 border border-white/20 active:scale-95">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        </div>

        <!-- Floating Bottom Overlay Controls -->
        <div class="slot-control-overlay absolute bottom-2 left-2 right-2 z-10 glass-overlay rounded-2xl p-2 flex flex-col gap-1 border border-white/10 shadow-2xl ${isUiHidden ? 'ui-hidden' : 'ui-visible'}">
          
          <!-- Seek Timeline Slider -->
          <div class="flex items-center gap-2 px-1">
            <span id="timeCur-${slot.id}" class="text-[10px] font-mono text-slate-300">0:00</span>
            <input type="range" id="seek-${slot.id}" min="0" max="100" value="0" step="0.1"
              oninput="seekVideo(${slot.id}, this.value)" class="flex-1 h-1">
            <span id="timeDur-${slot.id}" class="text-[10px] font-mono text-slate-400">0:00</span>
          </div>

          <!-- Controls Button Row -->
          <div class="flex items-center justify-between gap-1 pt-0.5">
            <div class="flex items-center space-x-1">
              <!-- Play/Pause -->
              <button onclick="togglePlaySlot(${slot.id})" class="p-2 rounded-xl bg-blue-600 active:bg-blue-700 text-white font-bold transition">
                <i id="btnPlayIcon-${slot.id}" data-lucide="play" class="w-4 h-4 fill-current"></i>
              </button>

              <!-- Mute Button -->
              <button onclick="toggleMuteSlot(${slot.id})" class="p-2 rounded-xl bg-white/10 active:bg-white/20 text-slate-200">
                <i id="btnMuteIcon-${slot.id}" data-lucide="volume-2" class="w-4 h-4"></i>
              </button>
            </div>

            <!-- Speed Selectors (0.2x, 0.3x, 0.4x, 0.5x, 0.6x, 1x) -->
            <div class="flex items-center space-x-1 bg-black/40 border border-white/10 px-2 py-1 rounded-xl">
              <i data-lucide="gauge" class="w-3.5 h-3.5 text-blue-400"></i>
              <select id="speed-${slot.id}" onchange="changeSpeedSlot(${slot.id}, this.value)" class="bg-transparent text-xs text-white focus:outline-none cursor-pointer font-medium">
                <option value="0.2" class="bg-slate-900">0.2x</option>
                <option value="0.3" class="bg-slate-900">0.3x</option>
                <option value="0.4" class="bg-slate-900">0.4x</option>
                <option value="0.5" class="bg-slate-900">0.5x</option>
                <option value="0.6" class="bg-slate-900">0.6x</option>
                <option value="1.0" selected class="bg-slate-900">1.0x</option>
                <option value="1.5" class="bg-slate-900">1.5x</option>
                <option value="2.0" class="bg-slate-900">2.0x</option>
              </select>
            </div>
          </div>

        </div>
      `;

      grid.appendChild(card);
      lucide.createIcons();
    }

    function togglePlaySlot(slotId) {
      const vid = document.getElementById(`vid-${slotId}`);
      const icon = document.getElementById(`btnPlayIcon-${slotId}`);
      if (!vid) return;

      if (vid.paused) {
        vid.play().then(() => {
          if (icon) icon.setAttribute('data-lucide', 'pause');
          lucide.createIcons();
        }).catch(() => showToast("Tap to play"));
      } else {
        vid.pause();
        if (icon) icon.setAttribute('data-lucide', 'play');
        lucide.createIcons();
      }
    }

    function toggleMuteSlot(slotId) {
      const vid = document.getElementById(`vid-${slotId}`);
      const icon = document.getElementById(`btnMuteIcon-${slotId}`);
      if (!vid) return;

      vid.muted = !vid.muted;
      if (icon) icon.setAttribute('data-lucide', vid.muted ? 'volume-x' : 'volume-2');
      lucide.createIcons();
    }

    function toggleFitMode(slotId) {
      const slot = slots.find(s => s.id === slotId);
      const vid = document.getElementById(`vid-${slotId}`);
      const fitIcon = document.getElementById(`fitIcon-${slotId}`);
      if (!slot || !vid) return;

      if (slot.fitMode === 'cover') {
        slot.fitMode = 'contain';
        vid.className = vid.className.replace('video-fit-cover', 'video-fit-contain');
        if (fitIcon) fitIcon.setAttribute('data-lucide', 'minimize');
        showToast("Fit Mode: Original Aspect");
      } else {
        slot.fitMode = 'cover';
        vid.className = vid.className.replace('video-fit-contain', 'video-fit-cover');
        if (fitIcon) fitIcon.setAttribute('data-lucide', 'maximize');
        showToast("Fill Mode: Edge-to-Edge");
      }
      lucide.createIcons();
    }

    function rotateVideo(slotId) {
      const slot = slots.find(s => s.id === slotId);
      const vid = document.getElementById(`vid-${slotId}`);
      if (!slot || !vid) return;

      slot.rotation = (slot.rotation + 90) % 360;
      vid.style.transform = `rotate(${slot.rotation}deg)`;
      showToast(`Rotated ${slot.rotation}°`);
    }

    function changeSpeedSlot(slotId, val) {
      const vid = document.getElementById(`vid-${slotId}`);
      const speed = parseFloat(val);
      if (vid) {
        vid.playbackRate = speed;
        showToast(`Speed set to ${speed}x`);
      }
    }

    function onVideoLoaded(slotId) {
      const vid = document.getElementById(`vid-${slotId}`);
      const dur = document.getElementById(`timeDur-${slotId}`);
      const speedSelect = document.getElementById(`speed-${slotId}`);
      if (vid && dur) dur.textContent = formatTime(vid.duration);
      if (vid && speedSelect) vid.playbackRate = parseFloat(speedSelect.value);
    }

    function onVideoTimeUpdate(slotId) {
      const vid = document.getElementById(`vid-${slotId}`);
      const seek = document.getElementById(`seek-${slotId}`);
      const cur = document.getElementById(`timeCur-${slotId}`);
      if (vid && seek && cur && !isNaN(vid.duration)) {
        seek.value = (vid.currentTime / vid.duration) * 100;
        cur.textContent = formatTime(vid.currentTime);
      }
    }

    function seekVideo(slotId, val) {
      const vid = document.getElementById(`vid-${slotId}`);
      if (vid && !isNaN(vid.duration)) {
        vid.currentTime = (val / 100) * vid.duration;
      }
    }

    function toggleMasterPlay() {
      const allPaused = slots.every(s => {
        const v = document.getElementById(`vid-${s.id}`);
        return v ? v.paused : true;
      });

      slots.forEach(s => {
        const v = document.getElementById(`vid-${s.id}`);
        const icon = document.getElementById(`btnPlayIcon-${s.id}`);
        if (v) {
          if (allPaused) {
            v.play();
            if (icon) icon.setAttribute('data-lucide', 'pause');
          } else {
            v.pause();
            if (icon) icon.setAttribute('data-lucide', 'play');
          }
        }
      });

      const masterIcon = document.getElementById('masterPlayIcon');
      if (masterIcon) masterIcon.setAttribute('data-lucide', allPaused ? 'pause' : 'play');
      lucide.createIcons();
    }

    function changeLayout(val) {
      updateLayoutClass();
    }

    function copyCodeToClipboard() {
      const formattedCode = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const textBtn = document.getElementById('copyGithubText');

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(formattedCode).then(() => {
          if (textBtn) textBtn.textContent = "Copied!";
          showToast("Code copied to clipboard!");
          setTimeout(() => { if (textBtn) textBtn.textContent = "Copy Code"; }, 2500);
        });
      } else {
        const ta = document.createElement("textarea");
        ta.value = formattedCode;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        if (textBtn) textBtn.textContent = "Copied!";
        showToast("Code copied to clipboard!");
        setTimeout(() => { if (textBtn) textBtn.textContent = "Copy Code"; }, 2500);
      }
    }

    function formatTime(sec) {
      if (isNaN(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function showToast(msg) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = "bg-slate-900/90 text-white text-xs px-3 py-1.5 rounded-full border border-white/20 shadow-xl backdrop-blur transition-all duration-300 opacity-0 transform translate-y-2";
      toast.textContent = msg;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.remove('opacity-0', 'translate-y-2'));
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 1800);
    }
  </script>
</body>
</html>
